# 로컬 모의투자 실행용 (PC 한 대). 운영 배포는 k8s/ 를 쓴다.
#
#   cp .env.example .env && $EDITOR .env        # 모의 앱키·계좌·FEE_RATE·POSTGRES_PASSWORD
#   docker compose up -d postgres
#   docker compose run --rm trader python -m scripts.kis_smoke 005930   # 조회만, 주문 없음
#   docker compose up -d trader
#   docker compose logs -f trader
#
# 손절은 trader 컨테이너가 살아 있을 때만 동작한다. PC 가 잠들거나 꺼지면 손절도 멈춘다.
# 그래서 trader 는 1개만 띄운다 (매도 주문을 내는 주체가 둘이면 같은 수량을 두 번 판다).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 넣으세요}
      POSTGRES_DB: trading
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 호스트에서 psql 로 보려면 127.0.0.1 에만 연다. 외부 인터페이스에는 열지 않는다.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trader:
    build: .
    image: stock-trading-kr:local
    env_file: .env
    environment:
      # .env 의 DATABASE_URL(로컬 pytest·스크립트용)을 컨테이너 안에서는 이 값으로 덮는다.
      DATABASE_URL: postgresql://trading:${POSTGRES_PASSWORD}@postgres:5432/trading
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.engine.main"]
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 인증 실패(exit 2)나 크래시 후 다시 뜬다. 토큰은 DB 에 캐시되므로 재시작마다 새로
    # 발급하지 않는다. 재시작하면 잔고 조회 → 손절 점검이 가장 먼저 돈다.
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
