# 매일 18:00 KST pg_dump → gzip, 7일 보관.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: stock-trading
  labels:
    app.kubernetes.io/part-of: stock-trading-kr
spec:
  schedule: "0 18 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: db-backup
              persistentVolumeClaim:
                claimName: db-backup-pvc
          containers:
            - name: db-backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TODAY=$(date +%Y-%m-%d)
                  pg_dump "$DATABASE_URL" | gzip > /backups/trading_${TODAY}.sql.gz
                  find /backups -name "trading_*.sql.gz" -mtime +7 -delete
                  ls -lh /backups
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
              volumeMounts:
                - name: db-backup
                  mountPath: /backups
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
